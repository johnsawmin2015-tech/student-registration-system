name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: student_registration_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_registration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/student_registration_test
      DATA_MODE: postgres
      SESSION_SECRET: ci-only-session-secret-change-me-0000000000000000000000000000
      SESSION_COOKIE_SECURE: 'false'
      ENABLE_HSTS: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      SEED_ADMIN_PASSWORD: NorthstarDemo!2026
      SEED_STAFF_PASSWORD: NorthstarDemo!2026
      SEED_VIEWER_PASSWORD: NorthstarDemo!2026

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm check-format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Apply test database migrations
        run: pnpm db:migrate

      - name: Seed bounded synthetic fixture data
        run: pnpm db:seed

      - name: Run integration tests
        run: pnpm test:integration

      - name: Audit production dependencies
        run: pnpm run audit

      - name: Build production application
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end smoke tests
        run: pnpm test:e2e
        env:
          DATA_MODE: demo
          ALLOW_DEMO_IN_PRODUCTION: 'true'
          DEMO_PASSWORD: DemoOnly!2026
