name: northstar-registration-demo

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-northstar_registration_demo}
      POSTGRES_USER: ${POSTGRES_USER:-northstar_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northstar_demo_local_only}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - northstar-postgres-data:/var/lib/postgresql/data

volumes:
  northstar-postgres-data:
    name: northstar-registration-demo-postgres-data
